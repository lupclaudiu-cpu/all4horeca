name: Cloudflare build test
on:
  push:
    branches: [ops/cloudflare-test]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save "next@>=16.4.5 <17" @opennextjs/cloudflare@latest wrangler@latest
      - name: OpenNext build
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://niavcqvhmeferakuerfs.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_UV_kmgRT54HK3E3RHlGhFw_-teUUokO
      - name: Size of the worker (free plan limit 3 MiB compressed)
        run: |
          ls -la .open-next/worker.js || true
          du -sh .open-next .open-next/server-functions 2>/dev/null || true
          npx wrangler deploy --dry-run --outdir /tmp/wr 2>&1 | tail -15
