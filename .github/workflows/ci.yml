name: CI
on:
  pull_request:
  push:
    branches: [ops/**, feat/**]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build:netlify
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://niavcqvhmeferakuerfs.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_UV_kmgRT54HK3E3RHlGhFw_-teUUokO
